# Tooling config for the DamageScale FastAPI service (lint rules per spec section 3).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
    "slow: loads real model weights or spawns a subprocess (minutes, not seconds)",
]
