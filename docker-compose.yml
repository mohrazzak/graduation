# DamageScale one-command demo: `docker compose up` -> web :3000 + api :8000.
# Configuration comes from an optional root `.env` (cp .env.example .env);
# every ${VAR:-default} below falls back to a safe value, so compose also
# works with no .env file at all (Supabase then stays in placeholder mode).
#
# NETWORKING — CRITICAL, read before deploying anywhere but localhost:
# The BROWSER (not the web container) calls the API, so NEXT_PUBLIC_API_URL
# must be an origin reachable from the user's machine — the default
# http://localhost:8000 — NOT http://api:8000, which only resolves on the
# internal compose network. For the university-server demo, set in .env:
#   NEXT_PUBLIC_API_URL=http://<server-host>:8000
#   CORS_ORIGINS=http://<server-host>:3000
# then run `docker compose up --build`: NEXT_PUBLIC_* are baked into the web
# bundle at image BUILD time (see web/Dockerfile), while CORS_ORIGINS is
# plain runtime env and needs only a container restart.
services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      # WHY mock by default: the real classifiers need ~3 GB of TensorFlow /
      # torch wheels that are deliberately NOT in the api image, plus weight
      # files that live outside the repo. Listing them here instead would render
      # three permanently-disabled entries in the model picker. To run the real
      # models, install api/requirements-models.txt, mount the weights, and set
      # ENABLED_MODELS + the *_WEIGHTS_PATH vars below.
      ENABLED_MODELS: ${ENABLED_MODELS:-mock}
      # Generation services. Without these the job routes still run their LOCAL
      # stages (building mask, edge map) and report a named reason for the rest.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRIPO_API_KEY: ${TRIPO_API_KEY:-}
      REPAIR_BACKEND: ${REPAIR_BACKEND:-auto}
      LOCAL_REPAIR_PYTHON: ${LOCAL_REPAIR_PYTHON:-}
      LOCAL_REPAIR_TIMEOUT_SECONDS: ${LOCAL_REPAIR_TIMEOUT_SECONDS:-900}
      RESNET_WEIGHTS_PATH: ${RESNET_WEIGHTS_PATH:-}
      YOLO_WEIGHTS_PATH: ${YOLO_WEIGHTS_PATH:-}
      RAED_WEIGHTS_PATH: ${RAED_WEIGHTS_PATH:-}
      RAED_SEG_WEIGHTS_PATH: ${RAED_SEG_WEIGHTS_PATH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

  web:
    build:
      context: ./web
      args:
        # Build args, not runtime env: Next.js inlines NEXT_PUBLIC_* at build
        # time. The `:-` form also covers EMPTY values, so an unfilled .env
        # falls back to the same placeholders as web/.env.local (auth shows
        # translated "not configured" errors until Supabase is provisioned).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://placeholder.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-placeholder-anon-key}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
